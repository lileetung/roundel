name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild test \
            -project Roundel.xcodeproj \
            -scheme Roundel \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
